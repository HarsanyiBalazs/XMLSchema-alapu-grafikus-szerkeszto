<p>projects works!</p>

<a [routerLink]="'/form'">Upload new schema</a>
<div *ngFor="let project  of projects">
    <div>
        {{project.name}}
    </div>
    <div>
        <button [routerLink]="'/form/' + project._id">Form Maker</button>
    </div>
    <div>
        <button (click)="onDeleteClick(project)">delete</button>
    </div>
</div>
